<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الادخار</title>
<meta name="theme-color" content="#0f1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script>(function(){var m='dark',p='orig';try{m=localStorage.getItem('sv_mode')||m;p=localStorage.getItem('sv_pal')||p}catch(e){}
document.documentElement.dataset.m=m;document.documentElement.dataset.p=p})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<style>
/* ألوان: النمط (فاتح/داكن) × اللوحة (أصلي/رجالي/نسائي) */
:root{--r:22px}
[data-p=orig]{--a:#7c5cff;--b:#00d4b4;--c:#ffb547;--d:#ff6b9a;--g1:#7c5cff;--g2:#4b6bff;--g3:#00d4b4;--d1:#7c5cff;--d2:#4b6bff;--d3:#00a8e8;--d4:#00b894;--d5:#e17055;--d6:#d63a82;--d7:#8e7cc3;--d8:#6c7aa8}
[data-p=men]{--a:#3b82f6;--b:#14b8a6;--c:#f59e0b;--d:#6366f1;--g1:#1d4ed8;--g2:#0ea5e9;--g3:#14b8a6;--d1:#1d4ed8;--d2:#2563eb;--d3:#0284c7;--d4:#0d9488;--d5:#b45309;--d6:#4338ca;--d7:#475569;--d8:#64748b}
[data-p=women]{--a:#ec4899;--b:#c084fc;--c:#fb7185;--d:#f472b6;--g1:#ec4899;--g2:#a855f7;--g3:#f472b6;--d1:#db2777;--d2:#c026d3;--d3:#9333ea;--d4:#e11d48;--d5:#f43f5e;--d6:#d946ef;--d7:#a78bfa;--d8:#f472b6}
[data-m=dark][data-p=orig]{--bg:#0f1226;--card:#1a1e3a;--card2:#23284d;--barbg:rgba(15,18,38,.85)}
[data-m=dark][data-p=men]{--bg:#0b1220;--card:#131c2e;--card2:#1b2740;--barbg:rgba(11,18,32,.85)}
[data-m=dark][data-p=women]{--bg:#1f1028;--card:#2b1838;--card2:#3a2249;--barbg:rgba(31,16,40,.85)}
[data-m=dark]{--txt:#f4f5ff;--mut:#9aa0c7}
[data-m=light][data-p=orig]{--bg:#f1f0ff;--card:#fff;--card2:#ebe9fb;--barbg:rgba(241,240,255,.88)}
[data-m=light][data-p=men]{--bg:#eef2f7;--card:#fff;--card2:#e5ebf4;--barbg:rgba(238,242,247,.88)}
[data-m=light][data-p=women]{--bg:#fff1f7;--card:#fff;--card2:#fde4ef;--barbg:rgba(255,241,247,.88)}
[data-m=light]{--txt:#1e1b3a;--mut:#6f6b8f}
[data-m=light] .card,[data-m=light] .item,[data-m=light] .sum{box-shadow:0 2px 12px rgba(60,40,120,.08)}
.btn.alt{color:var(--txt)}
input::placeholder{color:var(--mut);opacity:.8}
[data-m=dark]{color-scheme:dark}[data-m=light]{color-scheme:light}
[data-m=light] .card .v,[data-m=light] .sum b{color:color-mix(in srgb,var(--k,var(--b)) 68%,#000)}
[data-m=light] .card.static .v{color:var(--txt)}
[data-m=light] .seg button.on,[data-m=light] .btn{color:#fff}
[data-m=light] .btn.alt{color:var(--txt)}
[data-m=light] #reset{color:#c2185b}
.toast.act{pointer-events:auto}
.toast button{background:var(--a);color:#fff;border:0;border-radius:20px;padding:5px 14px;font:inherit;font-weight:700;margin-inline-start:10px;cursor:pointer}
.mon{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 4px;font-weight:800;font-size:16px}
.mon b{color:var(--b);font-size:15px}
[data-m=light] .mon b{color:color-mix(in srgb,var(--b) 68%,#000)}
.item{cursor:pointer}.item .n{font-size:12px;color:var(--c);margin-top:2px}.item .ed{color:var(--mut);font-size:16px}
.two.wrap{flex-wrap:wrap}.two.wrap div{min-width:calc(50% - 5px)}
.pals{display:flex;gap:8px}
.pals button{flex:1;border:3px solid transparent;border-radius:14px;padding:12px 4px;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.pals button.on{border-color:var(--txt)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Tajawal',system-ui,sans-serif;min-height:100%}
body{padding-bottom:110px}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;background:var(--barbg);backdrop-filter:blur(12px)}
.bar h1{font-size:20px;margin:0;font-weight:800}
.ib{background:var(--card);border:0;color:var(--txt);width:42px;height:42px;border-radius:14px;font-size:20px;cursor:pointer}
.wrap{padding:6px 16px;max-width:560px;margin:auto}
.hero{background:linear-gradient(135deg,var(--g1),var(--g2) 60%,var(--g3));border-radius:28px;padding:22px;box-shadow:0 14px 40px rgba(124,92,255,.35)}
.hero small{opacity:.85;font-size:14px}
.hero .goal{font-size:32px;font-weight:800;margin:2px 0 14px}
.pb{height:12px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .6s}
.hero .row{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:5px;background:var(--k)}
.card .t{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.card .v{font-size:24px;font-weight:800;margin-top:6px;color:var(--k)}
.card .v small{font-size:13px;font-weight:500;color:var(--mut)}
.card.static{cursor:default}
.wide{grid-column:1/-1}
.two{display:flex;gap:10px;margin-top:6px}
.two div{flex:1;background:var(--card2);border-radius:14px;padding:10px}
.two span{display:block;font-size:12px;color:var(--mut)}
.two b{font-size:19px}
.fab{position:fixed;inset-inline-start:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:22px;border:0;background:linear-gradient(135deg,var(--d),var(--c));color:#fff;font-size:34px;box-shadow:0 10px 28px rgba(255,107,154,.45);cursor:pointer;z-index:6}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{margin:0 0 12px;font-size:19px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--a);color:#fff}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cal button{border:0;border-radius:14px;padding:14px 4px;font:inherit;font-weight:800;font-size:18px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal button small{font-size:10px;font-weight:500;opacity:.85}
.cal button{transition:transform .2s,box-shadow .2s,opacity .2s}
.cal.has button:not(.sel){opacity:.45}
.cal button.sel{transform:scale(1.14);box-shadow:0 8px 22px rgba(0,0,0,.45);outline:3px solid #fff;z-index:2;position:relative}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 5px}
input{width:100%;background:var(--card2);border:2px solid transparent;color:var(--txt);border-radius:14px;padding:13px;font:inherit;font-size:17px}
input:focus{outline:0;border-color:var(--a)}
.btn{width:100%;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));margin-top:14px;cursor:pointer}
.btn.alt{background:var(--card2);margin-top:8px}
.manual{display:flex;gap:8px}
.manual .btn{margin:0;width:auto;padding:0 22px}
.page{position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto;display:none}
.page.on{display:block}
.sum{background:var(--card);border-radius:var(--r);padding:16px;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}
.sum b{font-size:24px;color:var(--b)}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:9px}
.dot{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:18px}
.item .m{flex:1}.item .m b{font-size:18px}.item .m div{font-size:12px;color:var(--mut)}
.item button{background:none;border:0;color:var(--d);font-size:18px;cursor:pointer}
.day{color:var(--mut);font-size:13px;margin:14px 4px 6px}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:30px;font-weight:700;z-index:20;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="bar"><h1>💰 حاسبة الادخار</h1><button class="ib" id="gear">⚙️</button></div>

<div class="wrap">
  <div class="hero">
    <small>الهدف</small>
    <div class="goal" id="goal">٠ ريال</div>
    <div class="pb"><i id="pb"></i></div>
    <div class="row"><span id="pct">٠٪</span><span id="rem"></span></div>
  </div>
  <div class="grid">
    <div class="card static wide" style="--k:var(--mut)"><div class="t">🏦 الموجود سابقًا (قبل بدء الادخار)</div><div class="v" id="prev" style="color:var(--txt)"></div></div>
    <div class="card" style="--k:var(--a)" data-t="net"><div class="t">💳 مدخر شبكة</div><div class="v" id="net"></div></div>
    <div class="card" style="--k:var(--c)" data-t="cash"><div class="t">💵 مدخر كاش</div><div class="v" id="cash"></div></div>
    <div class="card wide" style="--k:var(--b)" data-t="all"><div class="t">📊 الإجمالي</div>
      <div class="two"><div><span>بدون المبلغ السابق</span><b id="tot"></b></div><div><span>مع المبلغ السابق</span><b id="totp"></b></div></div>
    </div>
    <div class="card static wide" style="--k:var(--c)"><div class="t">📈 الإحصائيات</div>
      <div class="two"><div><span>متوسط الادخار اليومي</span><b id="stAvg"></b></div><div><span>هذا الشهر</span><b id="stMon"></b></div></div>
      <div class="two"><div><span>التاريخ المتوقع لبلوغ الهدف</span><b id="stEta" style="font-size:16px"></b></div></div>
    </div>
  </div>
</div>
<button class="fab" id="add">+</button>

<!-- add sheet -->
<div class="sheet-bg" id="addBg"><div class="sheet">
  <h2>إضافة مبلغ مدخر</h2>
  <div class="seg" id="typeSeg"><button data-v="net" class="on">💳 شبكة</button><button data-v="cash">💵 كاش</button></div>
  <div class="cal" id="cal"></div>
  <label>أو أدخل مبلغًا يدويًا</label>
  <input id="man" type="number" inputmode="decimal" placeholder="المبلغ">
  <label>التاريخ</label><input type="date" id="dt">
  <label>ملاحظة (اختياري)</label><input id="note" placeholder="مثال: راتب، مكافأة">
  <button class="btn" id="doAdd">إضافة</button>
  <button class="btn alt" id="addClose">إغلاق</button>
</div></div>

<!-- edit sheet -->
<div class="sheet-bg" id="edBg"><div class="sheet">
  <h2>تعديل المبلغ</h2>
  <div class="seg" id="edType"><button data-v="net">💳 شبكة</button><button data-v="cash">💵 كاش</button></div>
  <label>المبلغ</label><input id="edAmt" type="number" inputmode="decimal">
  <label>التاريخ</label><input id="edDt" type="date">
  <label>ملاحظة</label><input id="edNote">
  <button class="btn" id="edSave">حفظ التعديل</button>
  <button class="btn alt" id="edDel" style="color:var(--d)">🗑 حذف</button>
  <button class="btn alt" id="edClose">إغلاق</button>
</div></div>

<!-- settings sheet -->
<div class="sheet-bg" id="setBg"><div class="sheet">
  <h2>الإعدادات</h2>
  <label>المظهر</label>
  <div class="seg" id="modeSeg"><button data-v="light">☀️ فاتح</button><button data-v="dark">🌙 داكن</button></div>
  <label>الألوان</label>
  <div class="pals" id="pals">
    <button data-p="orig" style="background:linear-gradient(135deg,#7c5cff,#00d4b4)">الأصلي</button>
    <button data-p="men" style="background:linear-gradient(135deg,#1d4ed8,#14b8a6)">رجالي</button>
    <button data-p="women" style="background:linear-gradient(135deg,#ec4899,#a855f7)">بناتي</button>
  </div>
  <label>مبلغ الهدف (ريال)</label><input id="sGoal" type="number" inputmode="decimal">
  <label>الموجود سابقًا قبل تاريخ بدء الادخار (ريال)</label><input id="sPrev" type="number" inputmode="decimal">
  <button class="btn" id="sSave">حفظ</button>
  <button class="btn alt" id="inst" style="display:none">📲 تثبيت التطبيق على الجهاز</button>
  <button class="btn alt" id="exp">⬇️ تصدير البيانات</button>
  <button class="btn alt" id="impBtn">⬆️ استعادة البيانات</button>
  <input type="file" id="impFile" hidden>
  <button class="btn alt" id="reset" style="color:var(--d)">🗑 تصفير جميع البيانات</button>
  <button class="btn alt" id="setClose">إغلاق</button>
</div></div>

<!-- history page -->
<div class="page" id="page"><div class="bar"><h1 id="pTitle"></h1><button class="ib" id="back">✕</button></div>
  <div class="wrap"><div class="sum"><span>المجموع</span><b id="pSum"></b></div><div id="list"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('ar-SA-u-nu-latn',{maximumFractionDigits:2});
const R=n=>fmt(n)+' <small>ر.س</small>';
// فئات العملة السعودية (أوراق + عملات معدنية)
const DENOMS=[[500,'ورقة','var(--d1)'],[200,'ورقة','var(--d2)'],[100,'ورقة','var(--d3)'],[50,'ورقة','var(--d4)'],
  [10,'ورقة','var(--d5)'],[5,'ورقة','var(--d6)'],[2,'معدنية','var(--d7)'],[1,'معدنية','var(--d8)']];
let db,curType='net',view='all',sel=null;

/* ---------- SQLite (sql.js) ---------- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let warned=false;
function persist(){
  try{localStorage.setItem('savings_db',b64(db.export()));
      if(localStorage.getItem('savings_db')===null)throw 0;return true}
  catch(e){if(!warned){warned=true;toast('⚠️ تعذّر حفظ البيانات في المتصفح، صدّر نسخة احتياطية')}return false}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&db)persist()});
window.addEventListener('pagehide',()=>{if(db)persist()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
async function initDb(){
  const SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});
  let saved=null;try{saved=localStorage.getItem('savings_db')}catch(e){}
  db=saved?new SQL.Database(unb64(saved)):new SQL.Database();
  db.run(`CREATE TABLE IF NOT EXISTS entries(id INTEGER PRIMARY KEY AUTOINCREMENT,amount REAL NOT NULL,type TEXT NOT NULL,date TEXT NOT NULL,created INTEGER);
          CREATE TABLE IF NOT EXISTS settings(key TEXT PRIMARY KEY,value REAL);`);
  db.run("INSERT OR IGNORE INTO settings VALUES('goal',5000),('prev',0)");
  if(!q("PRAGMA table_info(entries)").some(c=>c.name==='note'))db.run("ALTER TABLE entries ADD COLUMN note TEXT");
  persist();
}
const q=(sql,p=[])=>{const st=db.prepare(sql);st.bind(p);const r=[];while(st.step())r.push(st.getAsObject());st.free();return r};
const setting=k=>q("SELECT value v FROM settings WHERE key=?",[k])[0]?.v||0;
const sum=t=>q(t==='all'?"SELECT IFNULL(SUM(amount),0) s FROM entries":"SELECT IFNULL(SUM(amount),0) s FROM entries WHERE type=?",t==='all'?[]:[t])[0].s;

/* ---------- UI ---------- */
function toast(m){const t=$('#toast');clearTimeout(window._ut);t.classList.remove('act');t.textContent=m;t.classList.add('on');window._ut=setTimeout(()=>t.classList.remove('on'),2200)}
function undoToast(row){const t=$('#toast');clearTimeout(window._ut);
  t.innerHTML='تم الحذف <button id="undo">↩ تراجع</button>';t.classList.add('on','act');
  $('#undo').onclick=()=>{db.run("INSERT INTO entries(id,amount,type,date,note,created) VALUES(?,?,?,?,?,?)",[row.id,row.amount,row.type,row.date,row.note,row.created]);persist();render();t.classList.remove('on','act')};
  window._ut=setTimeout(()=>t.classList.remove('on','act'),5000)}
const DF={day:'numeric',month:'long',year:'numeric'},LOC='ar-SA-u-ca-gregory-nu-latn';
function render(){
  const goal=setting('goal'),prev=setting('prev'),net=sum('net'),cash=sum('cash'),tot=net+cash,all=tot+prev;
  $('#goal').innerHTML=R(goal);$('#prev').innerHTML=R(prev);$('#net').innerHTML=R(net);$('#cash').innerHTML=R(cash);
  $('#tot').innerHTML=R(tot);$('#totp').innerHTML=R(all);
  const p=goal>0?Math.min(100,all/goal*100):0;
  $('#pb').style.width=p+'%';$('#pct').textContent=fmt(p)+'٪ من الهدف';
  $('#rem').textContent=all>=goal?'🎉 تم تحقيق الهدف':'المتبقي: '+fmt(goal-all)+' ر.س';
  const first=q("SELECT MIN(date) d FROM entries")[0].d,mon=q("SELECT IFNULL(SUM(amount),0) s FROM entries WHERE date LIKE ?",[today().slice(0,7)+'%'])[0].s;
  const days=first?Math.max(1,Math.round((new Date(today())-new Date(first))/864e5)+1):1,avg=first?tot/days:0;
  $('#stAvg').innerHTML=R(avg);$('#stMon').innerHTML=R(mon);
  if(goal>0&&all>=goal)$('#stEta').textContent='🎉 تحقق الهدف';
  else if(avg>0){const n=Math.ceil((goal-all)/avg),d=new Date();d.setDate(d.getDate()+n);$('#stEta').textContent=d.toLocaleDateString(LOC,DF)+' (≈ '+fmt(n)+' يوم)'}
  else $('#stEta').textContent='أضف مبالغ لحساب التوقع';
  if(!$('#page').classList.contains('on'))return;
  renderList();
}
const TITLES={net:'💳 المدخر شبكة',cash:'💵 المدخر كاش',all:'📊 كل المبالغ المدخرة'};
function renderList(){
  $('#pTitle').textContent=TITLES[view];
  const rows=q(view==='all'?"SELECT * FROM entries ORDER BY date DESC,id DESC":"SELECT * FROM entries WHERE type=? ORDER BY date DESC,id DESC",view==='all'?[]:[view]);
  $('#pSum').innerHTML=R(sum(view));
  if(!rows.length){$('#list').innerHTML='<div class="empty">لا توجد مبالغ بعد</div>';return}
  const mt={};rows.forEach(r=>{const k=r.date.slice(0,7);mt[k]=(mt[k]||0)+r.amount});
  let h='',lastD='',lastM='';
  const dt=(d,o)=>new Date(d+'T12:00:00').toLocaleDateString(LOC,o);
  for(const r of rows){
    const m=r.date.slice(0,7);
    if(m!==lastM){h+=`<div class="mon"><span>${dt(r.date,{month:'long',year:'numeric'})}</span><b>${fmt(mt[m])} ر.س</b></div>`;lastM=m;lastD=''}
    if(r.date!==lastD){h+=`<div class="day">${dt(r.date,{weekday:'long',day:'numeric',month:'long'})}</div>`;lastD=r.date}
    const n=r.type==='net';
    h+=`<div class="item" data-ed="${r.id}"><div class="dot" style="background:color-mix(in srgb,var(${n?'--a':'--c'}) 22%,transparent)">${n?'💳':'💵'}</div>
    <div class="m"><b>${fmt(r.amount)} ر.س</b><div>${n?'شبكة':'كاش'} • ${r.date}</div>${r.note?`<div class="n">📝 ${String(r.note).replace(/[<>&]/g,'')}</div>`:''}</div><span class="ed">✎</span></div>`;
  }
  $('#list').innerHTML=h;
}
function open(id){$(id).classList.add('on')}function close(id){$(id).classList.remove('on')}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function updSel(){
  document.querySelectorAll('#cal button').forEach(b=>b.classList.toggle('sel',+b.dataset.v===sel));
  $('#cal').classList.toggle('has',sel!==null);
  $('#doAdd').textContent=sel!==null?'إضافة '+fmt(sel)+' ر.س':'إضافة';
}
function addEntry(a){
  a=parseFloat(a);if(!(a>0)){toast('اختر فئة أو أدخل مبلغًا');return false}
  const goal=setting('goal'),prev=setting('prev'),before=goal>0?(sum('all')+prev)/goal*100:0;
  db.run("INSERT INTO entries(amount,type,date,note,created) VALUES(?,?,?,?,?)",[a,curType,$('#dt').value||today(),$('#note').value.trim(),Date.now()]);
  persist();render();$('#note').value='';
  const after=goal>0?(sum('all')+prev)/goal*100:0,ms=[100,75,50,25].find(m=>before<m&&after>=m);
  toast(ms===100?'🎉 مبارك! تحقق هدفك':ms?'🎉 وصلت إلى '+ms+'٪ من هدفك':'✓ أُضيف '+fmt(a)+' ر.س');return true;
}

function applyTheme(m,p,save){
  const h=document.documentElement;h.dataset.m=m;h.dataset.p=p;
  if(save){try{localStorage.setItem('sv_mode',m);localStorage.setItem('sv_pal',p)}catch(e){}}
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  document.querySelectorAll('#pals button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=getComputedStyle(h).getPropertyValue('--bg').trim()||'#0f1226';
}
function build(){
  applyTheme(document.documentElement.dataset.m,document.documentElement.dataset.p,false);
  $('#modeSeg').onclick=e=>{const b=e.target.closest('button');if(b)applyTheme(b.dataset.v,document.documentElement.dataset.p,true)};
  $('#pals').onclick=e=>{const b=e.target.closest('button');if(b)applyTheme(document.documentElement.dataset.m,b.dataset.p,true)};
  $('#cal').innerHTML=DENOMS.map(([v,k,c])=>`<button style="background:${c}" data-v="${v}">${v}<small>${k}</small></button>`).join('');
  $('#cal').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=+b.dataset.v;sel=sel===v?null:v;$('#man').value='';updSel()};
  $('#man').oninput=()=>{if($('#man').value!==''){sel=null;updSel()}};
  $('#doAdd').onclick=()=>{const a=sel!==null?sel:$('#man').value;if(addEntry(a)){sel=null;$('#man').value='';updSel()}};
  $('#typeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;curType=b.dataset.v;
    document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#add').onclick=()=>{$('#dt').value=today();sel=null;$('#man').value='';updSel();open('#addBg')};
  $('#addClose').onclick=()=>close('#addBg');
    $('#gear').onclick=()=>{$('#sGoal').value=setting('goal');$('#sPrev').value=setting('prev');open('#setBg')};
  $('#setClose').onclick=()=>close('#setBg');
  $('#sSave').onclick=()=>{
    db.run("INSERT OR REPLACE INTO settings VALUES('goal',?),('prev',?)",[parseFloat($('#sGoal').value)||0,parseFloat($('#sPrev').value)||0]);
    persist();render();close('#setBg');toast('تم الحفظ ✓')};
  document.querySelectorAll('.card[data-t]').forEach(c=>c.onclick=()=>{view=c.dataset.t;open('#page');renderList()});
  $('#back').onclick=()=>close('#page');
  let edId=null,edT='net';
  const edSeg=()=>document.querySelectorAll('#edType button').forEach(b=>b.classList.toggle('on',b.dataset.v===edT));
  $('#list').onclick=e=>{const b=e.target.closest('[data-ed]');if(!b)return;
    const r=q("SELECT * FROM entries WHERE id=?",[b.dataset.ed])[0];if(!r)return;
    edId=r.id;edT=r.type;$('#edAmt').value=r.amount;$('#edDt').value=r.date;$('#edNote').value=r.note||'';edSeg();open('#edBg')};
  $('#edType').onclick=e=>{const b=e.target.closest('button');if(b){edT=b.dataset.v;edSeg()}};
  $('#edClose').onclick=()=>close('#edBg');
  $('#edBg').onclick=e=>{if(e.target.id==='edBg')close('#edBg')};
  $('#edSave').onclick=()=>{const a=parseFloat($('#edAmt').value);if(!(a>0))return toast('أدخل مبلغًا صحيحًا');
    db.run("UPDATE entries SET amount=?,type=?,date=?,note=? WHERE id=?",[a,edT,$('#edDt').value||today(),$('#edNote').value.trim(),edId]);
    persist();render();close('#edBg');toast('تم حفظ التعديل ✓')};
  $('#edDel').onclick=()=>{const r=q("SELECT * FROM entries WHERE id=?",[edId])[0];if(!r)return;
    db.run("DELETE FROM entries WHERE id=?",[edId]);persist();render();close('#edBg');undoToast(r)};
  let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').style.display='block'});
  $('#inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('#inst').style.display='none'}};
  [ '#addBg','#setBg' ].forEach(id=>$(id).onclick=e=>{if(e.target.id===id.slice(1))close(id)});
  // تصفير
  $('#reset').onclick=()=>{
    if(!confirm('سيتم حذف جميع المبالغ المدخرة وإعادة الإعدادات إلى الوضع الافتراضي. هل تريد المتابعة؟'))return;
    if(!confirm('تأكيد أخير: لا يمكن التراجع عن هذا الإجراء. يُنصح بتصدير نسخة احتياطية أولًا.'))return;
    db.run("DELETE FROM entries");db.run("DELETE FROM sqlite_sequence WHERE name='entries'");
    db.run("INSERT OR REPLACE INTO settings VALUES('goal',5000),('prev',0)");
    persist();$('#sGoal').value=5000;$('#sPrev').value=0;render();close('#setBg');close('#page');toast('تم تصفير البيانات ✓')};
  // تصدير
  $('#exp').onclick=()=>{
    const data={app:'savings-calculator',version:1,exported:new Date().toISOString(),
      settings:{goal:setting('goal'),prev:setting('prev')},
      entries:q("SELECT amount,type,date,note FROM entries ORDER BY date,id")};
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    a.download='savings-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();try{localStorage.setItem('sv_lastExp',Date.now())}catch(e){}toast('تم التصدير ✓')};
  // استعادة
  $('#impBtn').onclick=()=>$('#impFile').click();
  $('#impFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(!Array.isArray(d.entries))throw 0;
      if(!confirm('سيتم استبدال البيانات الحالية ('+d.entries.length+' عملية). متابعة؟'))return;
      db.run("DELETE FROM entries");
      for(const r of d.entries)db.run("INSERT INTO entries(amount,type,date,note,created) VALUES(?,?,?,?,?)",[+r.amount,r.type==='cash'?'cash':'net',r.date,r.note||'',Date.now()]);
      db.run("INSERT OR REPLACE INTO settings VALUES('goal',?),('prev',?)",[+d.settings?.goal||0,+d.settings?.prev||0]);
      persist();render();close('#setBg');toast('تمت الاستعادة ✓');
    }catch(err){toast('ملف غير صالح')}
    e.target.value='';
  };
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
initDb().then(()=>{build();render();
  try{const le=+localStorage.getItem('sv_lastExp')||0;if(sum('all')>0&&Date.now()-le>14*864e5)setTimeout(()=>toast('💾 يُنصح بتصدير نسخة احتياطية من الإعدادات'),1500)}catch(e){}}).catch(()=>{document.body.innerHTML='<p style="padding:40px;text-align:center">تعذّر تحميل قاعدة البيانات. تحقق من الاتصال بالإنترنت.</p>'});
</script>
</body>
</html>
